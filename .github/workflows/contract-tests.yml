name: Framework contract tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build Rust control-plane CLI
        run: cargo build --locked
      - name: Run framework and native-solver boundary tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  control-plane:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Run Rust unit tests
        run: cargo test --locked
      - name: Run control-server session contracts
        run: npm test --prefix control-server
      - name: Run independent logger contracts
        run: cargo test --locked -p multiagent-logger
      - name: Install terminal-client dependencies
        run: npm ci --prefix client
      - name: Run terminal-client contracts
        run: npm test --prefix client
      - name: Run shell CLI and lifecycle contracts
        run: tests/run.sh
      - name: Run malicious orchestrator boundary contracts
        if: runner.os == 'Linux'
        run: sudo -E tests/malicious-orchestrator.sh
