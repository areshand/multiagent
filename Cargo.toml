[package]
name = "multiagent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Typed control plane for the Multiagent orchestration framework"
license = "MIT"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4.3"
libc = "0.2.189"
p256 = { version = "0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.9"

[features]
default = []
insecure-dev-signer = []
