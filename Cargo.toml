[package]
name = "multiagent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Typed control plane for the Multiagent orchestration framework"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
fs2 = "0.4.3"
libc = "0.2.189"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.9"
